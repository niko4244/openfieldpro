# OpenFieldPro production stack. Builds api/web/worker images and runs the full
# data plane. Bring up with: ./deploy.sh
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ofp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ofp
    volumes: ["../data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofp"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes: ["../data/minio:/data"]

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "pnpm --filter @ofp/db push && pnpm --filter @ofp/db seed"]
    restart: "no"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080} }
    depends_on: [api]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    environment:
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ofp
      NTFY_URL: ${NTFY_URL:-}
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile.prod:/etc/caddy/Caddyfile:ro", "../landing:/srv/landing:ro"]
    depends_on: [api, web]
