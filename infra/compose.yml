# OpenFieldPro infrastructure — Postgres+PostGIS, Redis, MinIO, Caddy.
# Works with podman compose or docker compose.
#   podman compose -f infra/compose.yml up -d
volumes:
  pgdata:
  miniodata:

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ofp
      POSTGRES_PASSWORD: ofp
      POSTGRES_DB: ofp
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ofpminio
      MINIO_ROOT_PASSWORD: ofpminio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [postgres, redis, minio]
